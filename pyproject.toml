[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notesep"
version = "0.1.0"
description = "Score-informed note separation and music editing"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2", "scipy>=1.10,<1.17", "soundfile>=0.13,<0.15",
  "mido>=1.3,<2", "torch>=2.3,<2.11", "einops>=0.8,<0.9",
  "librosa==0.11.0", "huggingface-hub>=0.33,<2",
]

[project.optional-dependencies]
studio = ["gradio==6.28.0", "spaces==0.51.3", "requests>=2.31,<3"]
transcription = ["gradio-client==2.7.1", "requests>=2.31,<3"]
muscriptor-local = ["muscriptor==0.3.0"]
baseline = ["scikit-learn>=1.5,<1.8"]
research = ["mir_eval==0.8.2", "pretty_midi==0.2.11", "matplotlib>=3.7,<4", "scikit-learn>=1.5,<1.8"]
train = ["hydra-core==1.3.2", "torchaudio>=2.3,<2.11"]
benchmark-editing = ["torchaudio>=2.3,<2.11"]
instrument-eval = ["museval @ https://github.com/DavidDiazGuerra/sigsep-mus-eval/archive/e2db7c552e7e58ef12b6ae34b4efb7a48fb289b4.zip", "musdb==0.4.3"]
test = ["pytest>=8,<10", "ruff>=0.15,<0.16"]

[project.scripts]
notesep = "notesep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.package-data]
notesep = ["studio_static/**/*", "studio_static/*", "legal/*"]
model_exp = ["LICENSE-*.txt", "LICENSE-*-provenance.json"]
