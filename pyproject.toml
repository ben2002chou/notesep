[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notesep"
version = "0.1.0"
description = "Score-informed note separation and music editing"
license = "AGPL-3.0-only"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<2", "scipy>=1.10,<1.17", "soundfile>=0.13,<0.15",
  "mido>=1.3,<2", "torch>=2.3,<2.11", "einops>=0.8,<0.9",
  "librosa==0.11.0", "huggingface-hub>=0.33,<2",
]

[project.optional-dependencies]
studio = [
  "gradio==6.28.0", "gradio-client==2.7.1", "spaces==0.51.3",
  "requests>=2.31,<3",
]
baseline = ["scikit-learn>=1.5,<1.8"]
train = [
  "hydra-core==1.3.2", "torch==2.3.0", "torchaudio==2.3.0",
  "numpy==1.26.4", "scipy==1.13.0", "soundfile==0.13.1",
]

[project.scripts]
notesep = "notesep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
notesep = [
  "studio_static/**/*", "studio_static/*", "legal/*",
  "models/LICENSE-*.txt",
]
